<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>測量 ST計算　簡易アプリ</title>
</head>
<style>

input{
    width:100%;
    box-sizing:border-box;
    font-size:20px;
    padding:10px;
    margin-bottom:10px;
}

button{
    width:100%;
    font-size:22px;
    padding:12px;
    margin-top:10px;
}

</style>
<body style="
max-width:700px;
margin:auto;
padding:20px;
font-size:18px;
">

<h2 style="text-align:center;">
測量 ST計算　簡易アプリ o2
</h2>

測点X：<input id="sx"
oninput="clearError()"
onkeydown="
if(event.key==='Enter' ||
   event.key==='ArrowRight' ||
   event.key==='ArrowDown')
document.getElementById('sy').focus();

if(event.key==='ArrowLeft' ||
   event.key==='ArrowUp')
document.getElementById('resetBtn').focus();
">

測点Y：<input id="sy"
oninput="clearError()"
onkeydown="
if(event.key==='Enter' ||
   event.key==='ArrowRight' ||
   event.key==='ArrowDown')
document.getElementById('bx').focus();

if(event.key==='ArrowLeft' ||
   event.key==='ArrowUp')
document.getElementById('sx').focus();
">

BackX：<input id="bx"
oninput="clearError()"
onkeydown="
if(event.key==='Enter' ||
   event.key==='ArrowRight' ||
   event.key==='ArrowDown')
document.getElementById('by').focus();

if(event.key==='ArrowLeft' ||
   event.key==='ArrowUp')
document.getElementById('sy').focus();
">

BackY：<input id="by"
oninput="clearError()"
onkeydown="
if(event.key==='Enter')
calc();

if(event.key==='ArrowRight' ||
   event.key==='ArrowDown')
document.getElementById('calcBtn').focus();

if(event.key==='ArrowLeft' ||
   event.key==='ArrowUp')
document.getElementById('bx').focus();
">
<br><br>

<button id="calcBtn"
onclick="calc()"
onkeydown="
if(event.key==='ArrowRight' ||
   event.key==='ArrowDown')
document.getElementById('reuseBtn').focus();

if(event.key==='ArrowLeft' ||
   event.key==='ArrowUp')
document.getElementById('by').focus();
">
計算
</button>

<button id="reuseBtn"
onclick="reusePoint()"
onkeydown="
if(event.key==='ArrowRight' ||
   event.key==='ArrowDown')
document.getElementById('resetBtn').focus();

if(event.key==='ArrowLeft' ||
   event.key==='ArrowUp')
document.getElementById('calcBtn').focus();
">
測点座標の引継ぎ
</button>

<button id="resetBtn"
onclick="resetInput()"
onkeydown="
if(event.key==='ArrowRight' ||
   event.key==='ArrowDown')
document.getElementById('sx').focus();

if(event.key==='ArrowLeft' ||
   event.key==='ArrowUp')
document.getElementById('reuseBtn').focus();
">
入力値リセット
</button>
<hr style="width:300px;">

<div id="result" tabindex="-1"></div>

<div style="display:flex; justify-content:center;">

<canvas id="map"
width="300"
height="300"
style="border:1px solid black; display:block;">
</canvas>

</div>
<script>

let lastSx = "";
let lastSy = "";
function clearError(){

    document.getElementById("sx").style.border = "";
    document.getElementById("sy").style.border = "";
    document.getElementById("bx").style.border = "";
    document.getElementById("by").style.border = "";
}
function resetInput(){

    document.getElementById("sx").value = "";
    document.getElementById("sy").value = "";
    document.getElementById("bx").value = "";
    document.getElementById("by").value = "";
    document.getElementById("result").innerHTML = "";
    clearError();

    document.getElementById("sx").focus();
}
function calc() {

    let sx = document.getElementById("sx").value;
    let sy = document.getElementById("sy").value;
    let bx = document.getElementById("bx").value;
    let by = document.getElementById("by").value;

    // ■ 数値チェック
    if (
    sx === "" || sy === "" || bx === "" || by === "" ||
    isNaN(Number(sx)) || isNaN(Number(sy)) ||
    isNaN(Number(bx)) || isNaN(Number(by))
) {

    // ■ エラー表示
    document.getElementById("result").innerHTML =
        "<span style='color:red; font-weight:bold;'>入力エラー：数値を入力してください</span>";

    // ■ 入力欄を赤くする
    document.getElementById("sx").style.border = "2px solid red";
    document.getElementById("sy").style.border = "2px solid red";
    document.getElementById("bx").style.border = "2px solid red";
    document.getElementById("by").style.border = "2px solid red";

    document.getElementById("result").focus();
    return;
}

    // 数値化（ここで初めて変換）
    sx = Number(sx);
    sy = Number(sy);
    bx = Number(bx);
    by = Number(by);
    // ===== 計算（測量仕様：Back → 測点） =====
    let dx = bx - sx;
    let dy = by - sy;

    let distance = Math.sqrt(dx*dx + dy*dy);

    let angle = Math.atan(dy / dx) * 180 / Math.PI;

if(dx < 0){
    angle += 180;
}
else if(dy < 0){
    angle += 360;
}
    if (angle < 0) angle += 360;

    // ===== DMS =====
    let d = Math.floor(angle);
    let m = Math.floor((angle - d) * 60);
    let s = Math.round((angle - d - m/60) * 3600);

    let direction = `${d}°${m}′${s}″`;

    // ===== 表示 =====
    document.getElementById("result").innerHTML =
    "<b>入力値</b><br>" +
    "測点X = " + sx + "<br>" +
    "測点Y = " + sy + "<br>" +
    "BackX = " + bx + "<br>" +
    "BackY = " + by + "<br><br>" +

    "<b>計算結果</b><br>" +
    "方向角 = " + direction + "<br>" +
    "点間距離 = " + distance.toFixed(3) ;
    // ===== 描画 =====
let canvas = document.getElementById("map");
let ctx = canvas.getContext("2d");

ctx.clearRect(0, 0, canvas.width, canvas.height);

// 北（補助線）
ctx.setLineDash([5,5]);
ctx.beginPath();
ctx.moveTo(canvas.width/2, canvas.height);
ctx.lineTo(canvas.width/2, 0);
ctx.stroke();
ctx.setLineDash([]);

ctx.fillText("N(0°)", canvas.width/2 + 5, 15);

// 中心
let x1 = canvas.width / 2;
let y1 = canvas.height / 2;

let rad = angle * Math.PI / 180;

let x2 = x1 + Math.sin(rad) * 120;
let y2 = y1 - Math.cos(rad) * 120;

// 線
ctx.beginPath();
ctx.moveTo(x1, y1);
ctx.lineTo(x2, y2);
ctx.stroke();

// 点
ctx.beginPath();
ctx.arc(x1, y1, 5, 0, Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(x2, y2, 5, 0, Math.PI*2);
ctx.fill();

// ラベル
ctx.fillText("測点(" + sx + "," + sy + ")", x1 + 10, y1);
ctx.fillText("Back(" + bx + "," + by + ")", x2 + 10, y2);

// 距離
let mx = (x1 + x2) / 2;
let my = (y1 + y2) / 2;
ctx.fillText(distance.toFixed(3), mx + 5, my);

// 角度
ctx.fillText(direction, x2 + 10, y2 - 10);

// 引継ぎ用保存
lastSx = document.getElementById("sx").value;
lastSy = document.getElementById("sy").value;
    document.getElementById("sx").focus();

// 入力クリア
document.getElementById("sx").value = "";
document.getElementById("sy").value = "";
document.getElementById("bx").value = "";
document.getElementById("by").value = "";

// フォーカス制御（スマホ判定）
if (window.innerWidth <= 768) {
    document.getElementById("result").focus();
} else {
    document.getElementById('sx').focus();
}
}
function reusePoint(){

    document.getElementById("sx").value = lastSx;
    document.getElementById("sy").value = lastSy;

    document.getElementById("bx").focus();

}
 if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "service-worker.js"
    );

}
</script>

</body>
</html>
